<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>저작권 보호 1차시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 위쪽 진행 레일 + 한 번에 한 활동 + 아래 고정 이동 바.
   테마 2개 — 1차시 '수업 창(window)' (PPT 템플릿 색), 2차시 '방탈출' (어두운 방송실). */
:root, body.t-lesson{
  --bg:#FCE2DB; --surface:#FFFFFF; --surface2:#FFFAED; --bar:#D9EDF4; --ink:#532F23; --line:#594638; --soft:#EFE3DC;
  --muted:#8A6E62; --accent:#D9455F; --accent-soft:#FDE4EA; --lav:#E1E6FF; --lav2:#D1C2E8; --pinkbar:#FDD3E1; --cream:#F9ECCF;
  --field:#FFF4F6; --field-line:#E7A6B5; --ans-ink:#D62F3C;
  --ok:#2E9E6A; --ok-soft:#E3F5EA; --warn:#D98A00; --warn-soft:#FFF1D0; --no:#D9455F; --no-soft:#FDE4EA;
  --teacher:#7B4FC9; --teacher-soft:#EEE6FB;
  --card-bg:#FFFFFF; --card-ink:#532F23; --card-line:#594638;
  --top-bg:#FFFFFF; --top-ink:#532F23;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-note:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --bw:2.5px;
  color-scheme:light;
}
body.t-escape{
  --bg:#0F1218; --surface:#191E27; --surface2:#141820; --bar:#232A36; --ink:#EDE6D6; --line:#343C4B; --soft:#232A36;
  --muted:#9AA3B5; --accent:#E9B949; --accent-soft:#3A3322; --lav:#2A3140; --lav2:#3A4356; --pinkbar:#3A3322; --cream:#2A2618;
  --field:#0D1016; --field-line:#E9B949; --ans-ink:#E9B949;
  --ok:#3CCB8F; --ok-soft:#14322A; --warn:#F0A63A; --warn-soft:#3A2C14; --no:#FF5C63; --no-soft:#3A1B1F;
  --teacher:#B796FF; --teacher-soft:#2A2340;
  --card-bg:#F1E6CC; --card-ink:#2A2117; --card-line:#2A2117;
  --top-bg:#0A0C10; --top-ink:#EDE6D6;
  --f-display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-note:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:12px; --bw:1.5px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));transition:background .3s}
body.t-escape{font-size:17px;background:radial-gradient(1200px 600px at 50% -200px,#26303F 0%,rgba(15,18,24,0) 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 32px),#0F1218}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:20;background:var(--top-bg);color:var(--top-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:var(--bw) solid var(--line)}
.t-lesson .top{background:var(--bar)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand{font-family:var(--f-display);font-size:20px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .c{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2.5px solid currentColor;font-family:var(--f-note);font-weight:800;font-size:15px;background:var(--surface)}
.t-escape .brand .c{border-color:var(--accent);color:var(--accent);background:transparent}
.hearts{font-size:15px;letter-spacing:2px;white-space:nowrap}
.hearts i{font-style:normal}
.hearts i:nth-child(1){color:#fff;-webkit-text-stroke:1.5px var(--line)}
.hearts i:nth-child(2){color:var(--lav2);-webkit-text-stroke:1.5px var(--line)}
.hearts i:nth-child(3){color:#FCE9A6;-webkit-text-stroke:1.5px var(--line)}
.t-escape .hearts{display:none}
.who{font-size:13.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.hchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--soft);font-variant-numeric:tabular-nums;min-height:36px}
.t-escape .hchip{font-family:var(--f-mono);background:#1A1F28;border:1px solid var(--line)}
.t-escape #timer{color:#FF8A8F;font-size:16px;letter-spacing:.04em;text-shadow:0 0 12px rgba(255,92,99,.45)}
.hchip.warn{background:var(--warn)!important;color:#1B1405!important;text-shadow:none!important}
.hchip.over{background:var(--no)!important;color:#fff!important;text-shadow:none!important}
.keybtn,.tbtn{border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;min-height:40px;white-space:nowrap}
.t-escape .keybtn{border-color:var(--accent);color:var(--accent);background:transparent}
.tbtn{border-color:var(--teacher);color:var(--teacher)}
.tbtn[aria-pressed="true"]{background:var(--teacher);color:#fff}
.bar{height:6px;background:var(--soft)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.teacher-flag{background:var(--teacher);color:#fff;font-size:13px;text-align:center;padding:5px 8px;font-family:var(--f-note)}
.keys-flag b{font-family:var(--f-mono);font-size:15px;background:rgba(255,255,255,.22);padding:1px 8px;border-radius:6px;margin:0 2px}

/* ── 레일 ── */
.rail{background:var(--surface);border-bottom:var(--bw) solid var(--line)}
.t-escape .rail{background:#12161D}
.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:thin;align-items:center}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:15px;min-height:42px}
.chip .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:13px;font-variant-numeric:tabular-nums;font-family:var(--f-note);font-weight:800}
.chip.cur{background:var(--pinkbar)}
.t-escape .chip.cur{background:var(--accent-soft);border-color:var(--accent)}
.chip.cur .n{background:var(--accent);color:#fff}
.t-escape .chip.cur .n{color:#1B1405}
.chip.done .n{background:var(--ok);color:#fff}
.chip.locked{opacity:.45}
.chip .lk{font-size:12px}
.period-tag{flex:none;font-size:12px;color:var(--muted);padding:0 2px 0 6px;font-family:var(--f-note);font-weight:800}

/* ── 섹션 머리 ── */
main{padding-block:24px 10px}
.eyebrow{font-size:14px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-note);font-weight:700}
.t-escape .eyebrow{font-family:var(--f-mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.sec-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
h1.st{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.2;margin:0;text-wrap:balance;flex:1;min-width:0}
.t-lesson h1.st{flex:0 1 auto;background:var(--bar);border:var(--bw) solid var(--line);border-radius:999px;padding:8px 26px}
.t-lesson h1.st::before{content:"♡ ";color:var(--accent)}
.t-lesson h1.st::after{content:" ♡";color:var(--accent)}
.t-escape h1.st{font-size:clamp(30px,5vw,44px);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.lead{color:var(--muted);margin:0 0 20px;max-width:68ch;font-family:var(--f-note);font-size:17px}
.t-lesson .lead{color:var(--ink)}
.lead b{color:var(--accent)}
.qbtn{flex:none;border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;min-height:38px;color:var(--muted)}
.qbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.qbox{margin:-4px 0 16px}

/* ── 블록 (1차시 = 창문 카드) ── */
.blk{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;position:relative}
.t-lesson .blk{box-shadow:6px 6px 0 rgba(89,70,56,.12)}
.t-lesson .blk:not(.info):not(.tfig)::before{content:"";display:block;height:16px;margin:-20px -20px 16px;background:var(--bar);border-bottom:var(--bw) solid var(--line);border-radius:calc(var(--r) - 3px) calc(var(--r) - 3px) 0 0}
.t-lesson .blk:has(> .blk-head)::before{display:none}
.blk-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.t-lesson .blk-head{margin:-20px -20px 16px;padding:8px 16px;background:var(--bar);border-bottom:var(--bw) solid var(--line);border-radius:calc(var(--r) - 3px) calc(var(--r) - 3px) 0 0}
.t-lesson .blk-head::after{content:"♡ ♡ ♡";color:var(--line);letter-spacing:1px;font-size:15px}
.blk h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1;min-width:0}
.t-escape .blk h2{font-size:21px;color:var(--accent)}
.blk .bl{color:var(--muted);font-size:15.5px;margin:0 0 14px;font-family:var(--f-note)}
.revbtn{flex:none;border:2px solid var(--teacher);color:var(--teacher);background:var(--teacher-soft);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;min-height:34px;font-family:var(--f-note)}
.info{background:var(--surface2)}
.t-lesson .info{border-radius:14px;box-shadow:none}
.info.warn{background:var(--warn-soft)}
.info.accent{background:var(--surface2)}
.t-lesson .info.accent{border-color:var(--line);position:relative;padding-left:20px}
.info p{margin:.4em 0;font-family:var(--f-note)}
.info.clue{background:var(--cream);border-style:dashed}
.cl-h{font-family:var(--f-display)!important;font-size:18px;color:var(--accent);margin:.2em 0 .4em!important}
.tag{display:inline-block;background:var(--lav2);color:var(--ink);border:var(--bw) solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;margin-right:6px;font-family:var(--f-note);font-weight:800}

/* 교사용 그림 */
.tfig{padding:12px;text-align:center;background:var(--surface)}
.tfig img{max-width:100%;height:auto;border-radius:12px;display:block;margin:0 auto;max-height:520px;object-fit:contain}
.tfig{margin:0 0 18px}
.tfig.small img{max-height:340px}
.tfig .svgwrap svg{width:100%;height:auto;max-width:760px;display:block;margin:0 auto}
.tfig figcaption{font-size:14px;color:var(--muted);margin-top:8px;font-family:var(--f-note)}
.tfig .tlabel{display:inline-block;margin-bottom:8px;background:var(--teacher);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px;font-family:var(--f-note)}

/* ── 본문 + 빈칸 ── */
.def{margin:.6em 0;line-height:2.3;font-size:18.5px}
.sub{margin:.4em 0 .2em;line-height:2.3;padding-left:.6em}
.note{color:var(--muted);font-size:15.5px;margin:.2em 0 .8em;padding-left:.6em;line-height:1.7;font-family:var(--f-note)}
.def b,.sub b{color:var(--accent)}
.axis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.axis>div{background:var(--surface2);border:var(--bw) solid var(--line);border-radius:14px;padding:6px 14px}
.blank{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;flex-wrap:wrap;max-width:100%}
.blank input{border:0;border-bottom:3px solid var(--field-line);background:var(--field);border-radius:10px 10px 3px 3px;padding:2px 8px;min-width:3.2em;width:calc(var(--w) * 1.05em + 1.4em);max-width:100%;text-align:center;color:var(--ans-ink);line-height:1.5;font-family:var(--f-body)}
.blank input::placeholder{color:#C7A3AA;letter-spacing:.08em}
.t-escape .blank input::placeholder{color:#5D6577}
.tilebtn{border:2px dashed var(--field-line);background:transparent;color:var(--accent);border-radius:10px;font-size:12.5px;padding:1px 8px;line-height:1.6;min-height:32px;font-family:var(--f-note);font-weight:800}
.blank.ok input{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blank.bad input{border-bottom-color:var(--no);background:var(--no-soft);color:var(--no)}
.ans{display:none;background:var(--teacher-soft);color:var(--teacher);border-radius:8px;padding:1px 8px;font-size:.9em;font-family:var(--f-note);font-weight:800}
body.revealall .ans,.reveal .ans{display:inline-block}
.ansbox{display:none;margin-top:10px;background:var(--teacher-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-family:var(--f-note)}
body.revealall .ansbox,.reveal .ansbox{display:block}
.ansbox b{color:var(--teacher)}
.field textarea{display:block;width:100%;border:var(--bw) solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);resize:vertical;min-height:48px;line-height:1.5;font-family:var(--f-note);font-size:16px;color:var(--ink)}
.t-escape .field textarea{background:var(--field);border-color:#2E3544}
.field textarea:focus{border-color:var(--accent);outline:none}
.field.need textarea:placeholder-shown{border-color:var(--warn)}
.free .q{margin:0 0 8px;font-size:18px}

/* 단계 */
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start;border:var(--bw) solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface2)}
.stn{flex:none;background:var(--lav);border:var(--bw) solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;margin-top:12px}
.step .def{margin:.2em 0}.step .note{margin:0;padding:0}

/* ── 도장 판정 ── */
.jitems{display:grid;gap:14px}
.jitems.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.jitem{border:var(--bw) solid var(--line);border-radius:14px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;min-width:0}
.t-escape .jitems.cards .jitem{background:var(--card-bg);color:var(--card-ink);border-color:var(--card-line);box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(-.4deg)}
.t-escape .jitems.cards .jitem:nth-child(even){transform:rotate(.5deg)}
.t-escape .jitems.cards .jitem .field textarea{background:#FFF8E6;color:#2A2117;border-color:#BBA67A}
.t-escape .jitems.cards .jitem .stamp{background:#FFF8E6;color:#2A2117;border-color:#BBA67A}
.jitem.ok{box-shadow:inset 0 0 0 3px var(--ok)!important}
.jitem.bad{box-shadow:inset 0 0 0 3px var(--no)!important}
.jq{display:flex;gap:8px;font-size:17.5px}
.t-escape .jq{font-weight:700}
.jq .num{flex:none;color:var(--accent)}
.t-escape .jitems.cards .jq .num{color:#B0412F}
.case-no{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;opacity:.7}
.t-escape .case-no::before{content:"■ ";color:#B0412F}
.stamps{display:flex;gap:8px;flex-wrap:wrap}
.stamp{position:relative;min-width:56px;min-height:50px;padding:6px 12px;border:var(--bw) solid var(--line);border-radius:14px;background:var(--surface);font-size:17px;transition:transform .15s;font-family:var(--f-body)}
.stamp.sym{font-size:24px;line-height:1}
.stamp.on{transform:rotate(-6deg);animation:press .28s ease-out;color:#fff!important}
.stamp.on.ok{background:var(--ok)!important;border-color:var(--ok)!important}
.stamp.on.warn{background:var(--warn)!important;border-color:var(--warn)!important}
.stamp.on.no{background:var(--no)!important;border-color:var(--no)!important}
.stamp.on.neutral{background:var(--accent)!important;border-color:var(--accent)!important}
@keyframes press{0%{transform:scale(1.35) rotate(-14deg);opacity:.4}70%{transform:scale(.94) rotate(-5deg)}100%{transform:scale(1) rotate(-6deg)}}
.stamps.mini{display:inline-flex;gap:4px;margin-left:4px}.stamps.mini .stamp{min-width:40px;min-height:38px;font-size:18px;padding:2px 8px}
.prev{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--f-note)}
.prev .pv{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;padding:0 6px;border:2px solid var(--line);background:var(--surface)}
.pv.ok{border-color:var(--ok);color:var(--ok)} .pv.warn{border-color:var(--warn);color:var(--warn)} .pv.no{border-color:var(--no);color:var(--no)}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:16px}
.lg{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#fff;font-weight:800}
.lg.ok{background:var(--ok)} .lg.warn{background:var(--warn)} .lg.no{background:var(--no)}
.lic{display:inline-flex;gap:3px;align-self:flex-start;background:#fff;border:1.5px solid #C9BBA0;border-radius:999px;padding:4px 8px;color:#222}
.licsvg{display:block}
.rec{display:none;margin-top:2px;background:var(--ok-soft);border-radius:10px;padding:8px 12px;font-size:15px;font-family:var(--f-note)}
.t-escape .jitems.cards .rec{background:#D8EEDF;color:#123B28}
.rec b{color:var(--ok)}
.cleared .rec{display:block}

/* ── 분류 ── */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:12px;border:2.5px dashed var(--line);border-radius:14px;background:var(--surface2);margin-bottom:12px}
.t-escape .pool{border-color:#3A4356;background:#10141A}
.pool:empty::before{content:"모든 카드를 옮겼어요!";color:var(--ok);align-self:center;padding:0 6px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bin{border:var(--bw) solid var(--line);border-radius:14px;background:var(--surface);min-height:120px;display:flex;flex-direction:column;transition:border-color .15s,background .15s}
.binhead{padding:9px 12px;border-bottom:var(--bw) solid var(--line);background:var(--bar);border-radius:11px 11px 0 0;font-family:var(--f-display)}
.t-escape .binhead{color:var(--accent)}
.binhead small{display:block;color:var(--muted);font-size:13px;line-height:1.4;font-family:var(--f-note)}
.binbody{padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}
.sort.selecting .bin{border-style:dashed;border-color:var(--accent)}
.bin.over{border-color:var(--accent)!important;background:var(--accent-soft)!important;border-style:solid!important}
.card{touch-action:none;user-select:none;-webkit-user-select:none;border:var(--bw) solid var(--card-line);background:var(--card-bg);color:var(--card-ink);border-radius:12px;padding:8px 12px;text-align:left;font-size:16px;line-height:1.35;box-shadow:0 3px 0 var(--card-line);max-width:100%;min-height:46px;font-family:var(--f-body)}
.t-lesson .card{border-width:2.5px;background:#FFFFFF}
.card small{display:block;color:#7A6A60;font-size:12.5px;margin-top:2px;font-family:var(--f-note)}
.card.sel{background:#FFE68A;transform:translateY(-2px)}
.card.dragging{opacity:.3}
.card.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.card.bad{border-color:var(--no);box-shadow:0 3px 0 var(--no)}
.card .ans{margin-top:4px;font-size:12px}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;margin:0;box-shadow:0 10px 24px rgba(0,0,0,.35);background:#FFE68A}

/* ── 순서 ── */
.olist{display:grid;gap:10px}
.orow{display:flex;gap:10px;align-items:stretch;border:var(--bw) solid var(--card-line);border-radius:14px;background:var(--card-bg);color:var(--card-ink);padding:10px}
.orow .rk{flex:none;width:58px;display:grid;place-items:center;text-align:center;border-radius:10px;background:#2A2117;color:#F1E6CC;font-family:var(--f-display);font-size:20px;line-height:1.1}
.orow .rk small{display:block;font-family:var(--f-note);font-size:11px;opacity:.8}
.orow .ob{flex:1;min-width:0;display:flex;align-items:center}
.orow .ob .def{margin:0;line-height:1.5}
.omv{flex:none;display:flex;flex-direction:column;gap:6px}
.omv button{width:46px;flex:1;min-height:40px;border:1.5px solid #BBA67A;border-radius:10px;background:#FFF8E6;color:#2A2117;font-size:16px}
.omv button:disabled{opacity:.3}
.olist.ok .orow{border-color:var(--ok)}.olist.bad .orow{border-color:var(--no)}

/* ── 출처 조립 ── */
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.photo .img{width:180px;max-width:100%;aspect-ratio:4/3;border-radius:10px;background:linear-gradient(180deg,#FF9E6B 0%,#FFC27A 40%,#7AA0D6 41%,#5B7FB8 70%,#3A8C55 71%,#2E6E44 100%);position:relative;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.3);transform:rotate(-2deg)}
.photo .img::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#FFE7A8;left:58%;top:18%}
.meta{font-size:14.5px;color:var(--muted);line-height:1.65;min-width:0;font-family:var(--f-note)}
.meta b{color:var(--ink)}
.citeline{min-height:60px;border:var(--bw) solid var(--accent);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);margin-bottom:10px}
.citeline:empty::before{content:"여기에 출처 문장이 만들어져요";color:var(--muted)}
.citeline.ok{border-color:var(--ok)}.citeline.bad{border-color:var(--no)}
.tok{border:1.5px solid var(--card-line);background:var(--card-bg);color:var(--card-ink);border-radius:999px;padding:6px 12px;font-size:15px;min-height:40px;max-width:100%;overflow-wrap:anywhere;font-family:var(--f-note);font-weight:700}
.citeline .tok{background:var(--accent);color:#1B1405;border-color:var(--accent)}
.t-lesson .citeline .tok{color:#fff}
.citeline .tok:not(:last-child)::after{content:","}
.tokpool{display:flex;flex-wrap:wrap;gap:8px}
.tok[disabled]{opacity:.25}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;min-height:36px;font-family:var(--f-note)}

/* ── CCL ── */
.ccl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin:10px 0}
.ccl{display:flex;gap:12px;border:var(--bw) solid var(--line);border-radius:14px;padding:12px;background:var(--surface2);min-width:0}
.ccl-ic{flex:none;width:58px;display:flex;justify-content:center;padding-top:4px;color:var(--ink)}
.ccsvg{display:block}
.ccl-body{min-width:0}
.ccl-body .def{margin:0;line-height:2.1;font-size:17px}
.ccl-body .note{padding:0;margin:4px 0 0}
.credit{font-size:13px}

/* ── 표 ── */
.tbl-wrap{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:15.5px;min-width:440px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--f-note)}
.tbl th,.tbl td{border-bottom:1px solid var(--soft);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bar);font-family:var(--f-display);font-weight:400}
.tbl tr:last-child td{border-bottom:0}

/* ── 등록 ── */
.reg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:center}
.reg label{display:block;margin:0 0 6px}
.reg .inp{width:100%;border:var(--bw) solid var(--line);border-radius:14px;padding:12px 14px;font-size:21px;background:var(--surface2);font-family:var(--f-body)}
.reg .inp:focus{border-color:var(--accent);outline:none}
.reg .row{margin-bottom:14px}
.idcard{border-radius:18px;padding:18px;position:relative;overflow:hidden;aspect-ratio:1.6/1;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;border:var(--bw) solid var(--line)}
.t-lesson .idcard{background:var(--bar);color:var(--ink)}
.t-escape .idcard{background:linear-gradient(135deg,#2A2F3A,#151920);color:#EDE6D6;border-color:#E9B949}
.idcard::before{content:"©";position:absolute;right:-18px;bottom:-60px;font-size:200px;line-height:1;opacity:.1;font-weight:800}
.idcard .t1{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;opacity:.7}
.idcard .t2{font-family:var(--f-display);font-size:26px}
.idcard .nm{font-size:27px;font-family:var(--f-display)}
.idcard .no{font-family:var(--f-mono);font-size:15px;opacity:.85}
.idcard .seal{position:absolute;right:18px;top:16px;width:66px;height:66px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;transform:rotate(12deg);text-align:center;line-height:1.15;font-family:var(--f-note);font-weight:800}

/* ── 자물쇠 ── */
.lockp{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:16px;padding:16px 18px;margin:6px 0 18px;background:linear-gradient(180deg,#2B2618,#1C1910);border:2px solid #E9B949;color:#F4E7C4;box-shadow:0 0 0 4px rgba(233,185,73,.08),0 10px 30px rgba(0,0,0,.4)}
.lockp .lk-ic{flex:none;width:56px;height:56px;display:grid;place-items:center}
.lockp .lk-body{flex:1;min-width:200px}
.lockp .lk-t{font-family:"Black Han Sans",var(--f-display);font-size:21px;color:#E9B949;letter-spacing:.04em}
.lockp .lk-st{display:block;font-size:15px;opacity:.92;margin-top:2px}
.lockp .lk-meta{font-size:12px;opacity:.65;margin-top:2px;font-family:var(--f-mono)}
.lk-btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:17px;background:#E9B949;color:#1B1405;min-height:54px;box-shadow:0 4px 0 #8C6A1E}
.lk-btn:disabled{opacity:.55;box-shadow:none}
.lockp.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lockp.open{background:linear-gradient(180deg,#123528,#0C251C);border-color:#3CCB8F;color:#DFF7EC}
.lockp.open .lk-t{color:#3CCB8F}
.lockp.open .lk-btn{background:#3CCB8F;box-shadow:0 4px 0 #1C7A52}
.gotletter{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:10px;background:#F1E6CC;color:#123528;font-family:"Black Han Sans",var(--f-display);font-size:27px;margin-left:6px;vertical-align:middle;animation:pop .5s}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}

/* ── 게이트 ── */
.gatebox{display:grid;gap:14px;justify-items:start}
.door{width:100%;border-radius:16px;background:repeating-linear-gradient(90deg,#1E2532 0 22px,#18202B 22px 44px);border:2px solid #E9B949;color:#EDE6D6;padding:26px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.door .big-ic{font-family:"Black Han Sans";font-size:44px;line-height:1;color:#E9B949}
.door .dt{font-family:"Black Han Sans";font-size:25px}
.door .ds{opacity:.85;font-size:15px}
.keyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keyin{width:9.5em;font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:.3em;text-align:center;border:3px solid #E9B949;border-radius:12px;padding:8px 10px;background:#0B0E13;color:#E9B949}
.keymsg{font-weight:700;min-height:1.5em}
.keymsg.bad{color:var(--no)}.keymsg.good{color:var(--ok)}
.gatebox ul{font-family:var(--f-note)}

/* ── 탈출문 ── */
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.slot{width:58px;height:66px;border-radius:12px;border:3px dashed #3A4356;display:grid;place-items:center;font-family:"Black Han Sans";font-size:31px;background:#0D1016}
.slot.f{border-style:solid;border-color:#E9B949;background:#F1E6CC;color:#2A2117;cursor:pointer}
.ltiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ltile{width:58px;height:58px;border-radius:12px;border:2px solid #2A2117;background:#F1E6CC;color:#2A2117;font-family:"Black Han Sans";font-size:29px;box-shadow:0 4px 0 #8C6A1E}
.ltile[disabled]{opacity:.2;box-shadow:none}
.ltile.miss{display:inline-grid;place-items:center;border-style:dashed;border-color:#3A4356;background:transparent;color:var(--muted);box-shadow:none;font-family:var(--f-note);font-size:13px}
.final-ok{font-family:"Black Han Sans";font-size:28px;color:var(--ok)}

/* ── 보스 ── */
.boss-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mon{width:110px;height:110px;flex:none;position:relative;filter:drop-shadow(0 0 18px rgba(155,100,255,.5))}
.mon.hit{animation:hit .4s}
.mon.dead{filter:grayscale(1);opacity:.45;transform:rotate(80deg) translateY(10px);transition:all .6s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}60%{transform:translateX(8px) rotate(5deg)}}
.dmg{position:absolute;left:50%;top:0;color:var(--no);font-family:"Black Han Sans";font-size:28px;animation:dmg .8s forwards;pointer-events:none}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-40px);opacity:0}}
.gauges{flex:1;min-width:220px;display:grid;gap:8px}
.gauge .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.gauge .trk{height:16px;border-radius:999px;background:#0B0E13;border:1px solid var(--line);overflow:hidden}
.gauge .trk i{display:block;height:100%;border-radius:999px;transition:width .4s}
.gauge.hp i{background:linear-gradient(90deg,#FF5C63,#FF9A5C)} .gauge.en i{background:linear-gradient(90deg,#E9B949,#F6DD8A)}
.bossmsg{font-weight:700;color:var(--accent)}
.attack{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.bq{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-top:1px solid var(--line)}
.bq .num{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--accent);width:30px;padding-top:8px}
.bq .def{margin:0;flex:1;min-width:0;font-size:17px}
.bq.ok{background:var(--ok-soft);border-radius:10px}
.bq.bad{background:var(--no-soft);border-radius:10px}
.bq .mark{flex:none;width:30px;font-size:18px;padding-top:8px;text-align:center}
.coup{font-size:13px;color:var(--muted)}
.win{font-family:"Black Han Sans";font-size:27px;color:var(--ok)}

/* ── 버튼·제출 ── */
.big{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font-size:19px;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);min-height:56px;font-family:var(--f-display)}
.t-escape .big{color:#1B1405;box-shadow:0 4px 0 #8C6A1E}
.big:active{transform:translateY(2px)}
.checklist{display:grid;gap:6px;margin:0 0 16px;padding:0;list-style:none;font-family:var(--f-note)}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--soft);font-size:15px}
.checklist li .s{flex:1;min-width:0}
.checklist li .c{font-variant-numeric:tabular-nums;font-weight:700}
.checklist li.ok{background:var(--ok-soft)} .checklist li.ok .c{color:var(--ok)}
.checklist li button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;min-height:34px}
.reset{margin-top:24px;font-size:14px;color:var(--muted);font-family:var(--f-note)}
.reset button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:38px}

/* ── 아래 이동 ── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--top-bg);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.t-lesson .foot{background:var(--surface2)}
.foot .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.foot .nav{border:var(--bw) solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;min-height:52px;font-family:var(--f-display);font-size:17px}
.foot .nav.next{background:var(--accent);border-color:var(--accent);color:#fff}
.t-escape .foot .nav.next{color:#1B1405}
.foot .nav:disabled{opacity:.35}
.foot .mid{flex:1;text-align:center;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-note)}

/* ── 아래 시트 ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);color:var(--ink);border-top:var(--bw) solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s}
.sheet.open{transform:none}
.sheet:not(.open){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sheet .in{max-width:900px;margin:0 auto}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .hd span{flex:1}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tile{width:58px;height:58px;border-radius:14px;border:2.5px solid #594638;background:#FFF4D6;color:#532F23;font-size:25px;box-shadow:0 3px 0 #594638;font-family:var(--f-body)}
.tile[disabled]{opacity:.2;box-shadow:none}
.sheet .preview{font-size:23px;color:var(--accent);min-height:34px;margin-bottom:10px;letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#1E1712;color:#fff;padding:10px 18px;border-radius:999px;z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;font-family:var(--f-note);font-weight:700}
.t-escape .toast{background:#E9B949;color:#1B1405}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 결과지 (항상 흰 종이) ── */
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.75);display:flex;flex-direction:column}
.modal .mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:#1E1712;color:#fff;font-family:"Gothic A1",sans-serif}
.modal .mh b{flex:1;min-width:0}
.modal .mb{flex:1;overflow:auto;padding:20px 12px 40px;-webkit-overflow-scrolling:touch}
.modal .mbtn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;min-height:46px}
.modal .mbtn.p{background:#FFD24A;color:#1E1712}
.modal .mbtn.s{background:rgba(255,255,255,.15);color:#fff}
#pages{display:flex;flex-direction:column;align-items:center;gap:16px}
.rpage{width:720px;height:1018px;flex:none;background:#fff;color:#111;padding:40px 44px 36px;position:relative;overflow:hidden;font-family:"Gothic A1","Apple SD Gothic Neo",sans-serif;font-size:13px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.rpage .pn{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:#888}
.rp-head{border-bottom:2px solid #532F23;padding-bottom:10px;margin-bottom:12px}
.rp-head .k{font-size:11px;color:#555}
.rp-head h1{font-family:"Jua",sans-serif;font-weight:400;font-size:26px;margin:2px 0 6px;color:#532F23}
.rp-head .idrow{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.rp-head .idrow b{font-weight:800}
.rp-sec{font-weight:800;font-size:15px;margin:14px 0 6px;padding:4px 10px;background:#FCE2DB;border-left:4px solid #D9455F;color:#532F23}
.rp-u{margin:4px 0}
.rp-u .def,.rp-u .sub{line-height:1.8;margin:3px 0;font-size:13px;font-family:"Gothic A1",sans-serif}
.rp-u .note{display:none}
.rv{font-weight:800;color:#C2263A;border-bottom:1.5px solid #C2263A;padding:0 4px}
.rv.empty{color:#bbb;border-bottom-color:#bbb}
.rp-row{display:grid;grid-template-columns:1fr 92px 1.2fr;gap:8px;border-bottom:1px solid #E3E6EE;padding:5px 0;align-items:start}
.rp-row.two{grid-template-columns:1fr 1fr}
.rp-row.three{grid-template-columns:1.3fr 1fr 1fr}
.rp-st{font-weight:800;font-size:16px}
.rp-st.ok{color:#17905E} .rp-st.warn{color:#C27C00} .rp-st.no{color:#D23838}
.rp-bin{margin:3px 0}
.rp-bin b{display:inline-block;min-width:120px}
.rp-chip{display:inline-block;border:1px solid #bbb;border-radius:6px;padding:0 6px;margin:2px 3px 2px 0}
.rp-chip.cor{border-color:#E3262C;color:#E3262C}
.rp-free{margin:4px 0 8px}
.rp-free .q{font-weight:700}
.rp-free .a{white-space:pre-wrap;border:1px solid #DDE1EA;border-radius:6px;padding:5px 8px;min-height:24px}
.rp-ox{font-weight:800}
.rp-ox.o{color:#17905E} .rp-ox.x{color:#E3262C}
.rp-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#444;margin-top:6px}
.rp-legend{font-size:11px;color:#666;margin-top:4px}
.rp-table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
.rp-table th,.rp-table td{border:1px solid #D9DDE7;padding:3px 6px;text-align:left}
.rp-table th{background:#FCE2DB}
.rp-w{color:#E3262C;font-size:11px}
.rp-q{background:#FFF5DA;border-radius:6px;padding:4px 8px;margin:3px 0}
.rp-ans{background:#E6F5EC;color:#0E5C3B;border-radius:6px;padding:4px 8px;margin:2px 0 8px;font-size:12px;line-height:1.5}
.rp-ans b{color:#17905E}
.rp-ans.lock{background:#F2F3F7;color:#888}
.rp-ok{color:#17905E;font-weight:800;font-size:12px}
.rp-blk{border-bottom:1px solid #E3E6EE}.rp-blk .rp-row{border-bottom:0}

@media (max-width:560px){
  body{font-size:16.5px}
  .brand .txt,.hearts{display:none}
  .blk{padding:16px}
  .t-lesson .blk:not(.info):not(.tfig)::before,.t-lesson .blk-head{margin-left:-16px;margin-right:-16px;margin-top:-16px}
  .jitems.cards{grid-template-columns:1fr}
  .foot .nav{padding:10px 12px}
  .t-lesson h1.st{padding:6px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff!important;padding:0}
  body>*:not(#modal){display:none!important}
  #modal{position:static;background:#fff;display:block!important}
  #modal .mh{display:none}
  #modal .mb{overflow:visible;padding:0}
  #pages{display:block}
  .rpage{box-shadow:none;page-break-after:always;break-after:page;margin:0 auto}
  @page{size:A4;margin:0}
}

/* ── 1차시 중간안: 밤하늘 배경 + 밝은 창문 카드 (2차시와 한 시리즈) ── */
body.t-lesson{
  --page-ink:#F4EEFF; --page-muted:#C9BFE6;
  background:
    radial-gradient(2px 2px at 12% 18%,rgba(255,255,255,.85) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 9%,rgba(255,255,255,.7) 50%,transparent 51%),
    radial-gradient(2px 2px at 88% 42%,rgba(255,236,170,.9) 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 35% 64%,rgba(255,255,255,.6) 50%,transparent 51%),
    radial-gradient(2px 2px at 58% 83%,rgba(255,214,230,.85) 50%,transparent 51%),
    radial-gradient(1200px 700px at 50% -250px,#4A3F86 0%,rgba(36,32,74,0) 70%),
    #24204A;
  background-size:420px 420px,380px 380px,460px 460px,520px 520px,400px 400px,auto,auto;
  background-attachment:fixed;
}

<script>
const D = {"teacher": false, "part": 1, "sections": [{"key": "start", "kind": "start", "period": 1, "title": "수사관 등록", "short": "등록", "lead": "긴급 상황! 무단 복제 괴물 <b>카피몬</b>이 학교 방송실을 점거하고, 허락 없이 가져온 자료로 축제 영상을 만들려 해요. 1차시에는 <b>수사관 교육</b>을 받고, 2차시에 <b>출동</b>해서 방 8개의 자물쇠를 풀고 카피몬을 막아야 해요. 먼저 수사관 등록부터!", "blocks": [{"t": "register"}]}, {"key": "think", "kind": "lesson", "period": 1, "title": "사건 접수: 이것도 괜찮을까?", "short": "생각 열기", "lead": "괜찮다고 생각하면 ○, 문제가 있을 수 있으면 △, 명백히 안 된다고 생각하면 × 도장을 찍고 이유를 한 줄로 적어요. 지금은 정답보다 내 생각이 중요해요. 2차시 끝에 다시 비교해 볼 거예요!", "blocks": [{"t": "judge", "id": "think", "opts": ["○", "△", "×"], "reason": "판단 이유 한 줄", "items": [{"id": "i1", "q": "구글 이미지에서 찾은 사진을 발표 자료에 넣고 출처를 쓰지 않았다."}, {"id": "i2", "q": "유료 웹툰 장면을 캡처해서 반 단체방에 올렸다."}, {"id": "i3", "q": "무료 폰트를 내려받아 학교 발표 자료에 사용했다."}, {"id": "i4", "q": "언론사 공식 기사 링크만 친구에게 공유했다."}, {"id": "i5", "q": "AI가 만든 글을 그대로 수행평가에 제출했다."}]}]}, {"key": "terms", "kind": "lesson", "period": 1, "title": "교육 ① 저작물 · 저작자 · 저작권", "short": "용어", "lead": "선생님 설명을 들으며 핵심 빈칸을 채워요. 막히면 <b>조각</b> 버튼! (1차시 조각은 무제한)", "blocks": [{"t": "text", "html": "<p class='def'>1. ( ⟦k1⟧ ) : 인간의 ( ⟦k2⟧ ) 또는 ( ⟦k3⟧ )을 표현한 ( ⟦k4⟧ )</p><p class='sub'>조건 ① 다른 사람이 인식할 수 있도록 밖으로 ( ⟦k5⟧ )되어야 함</p><p class='note'>머릿속 생각이나 아이디어만으로는 부족하며, 글·그림·음악·영상·코드 등 다른 사람이 알 수 있는 형태로 표현되어야 한다.</p><p class='sub'>조건 ② ( ⟦k6⟧ )이 있어야 함</p><p class='note'>단순한 사실이나 아이디어 자체가 아니라, 창작자의 생각이나 감정이 담긴 창작적인 표현이어야 한다.</p><p class='note'><b>종류</b> 어문, 음악, 연극, 미술, 건축, 사진, 영상, 도형, 컴퓨터 프로그램, 2차적 저작물 등</p>"}, {"t": "text", "html": "<p class='def'>2. ( ⟦k7⟧ ) : 저작물을 <b>창작</b>한 사람</p><p class='def'>3. ( ⟦k8⟧ ) : 저작권을 가진 사람이나 기관</p><p class='note'>보통은 저작자가 저작권자이지만, 계약이나 양도에 따라 저작자와 저작권자가 다를 수 있다.<br>예) 내가 찍은 사진 → 내가 저작자이자 저작권자<br>예) 출판사와 계약한 책 → 작가가 저작자, 계약에 따라 출판사가 일정한 이용 권한을 가질 수 있음</p><p class='def'>4. ( ⟦k9⟧ ) : 저작자가 자신의 저작물에 대해 가지는 <b>권리</b></p>"}]}, {"key": "protect", "kind": "lesson", "period": 1, "title": "교육 ② 저작권, 왜 보호해야 할까?", "short": "왜 보호?", "lead": "내가 밤새도록 열심히 그린 그림을 다른 친구가 허락 없이 가져가서 자기 그림이라고 발표한다면 기분이 어떨까요?", "blocks": [{"t": "free", "id": "feel", "q": "그때 내 기분은?", "ph": "솔직한 기분을 적어 보세요", "rows": 2}, {"t": "info", "tone": "accent", "html": "<p><b>저작권을 보호하는 이유</b></p><p>① 창작자의 <b>노력</b>과 <b>가치</b>를 인정하기 위해<br>② 창작자의 <b>인격</b>과 <b>명예</b>를 보호하기 위해<br>③ 새로운 작품을 만들 <b>창작 의욕</b>을 지키기 위해<br>④ 문화 산업과 사회 <b>발전</b>을 위해</p>"}]}, {"key": "rights", "kind": "lesson", "period": 1, "title": "교육 ③ 저작권의 두 큰 축과 특징", "short": "두 큰 축", "lead": "저작권은 크게 두 가지로 나뉘어요. 권리 10개가 어느 쪽인지는 2차시 <b>증거 분류실</b>에서 직접 분류할 거예요!", "blocks": [{"t": "text", "title": "두 가지 권리", "html": "<div class='axis'><div><p class='def'>( ⟦k10⟧ )</p><p class='sub'>저작자의 ( ⟦k11⟧ )와 인격적 이익을 보호</p></div><div><p class='def'>( ⟦k12⟧ )</p><p class='sub'>저작자의 ( ⟦k13⟧ ) 이익을 보호</p></div></div><div class='tbl-wrap'><table class='tbl'><thead><tr><th>권리</th><th>의미</th></tr></thead><tbody><tr><td>공표권</td><td>내 작품을 세상에 공개할지, 언제, 어떻게 공개할지 결정하는 권리</td></tr><tr><td>성명표시권</td><td>내 작품에 이름을 표시할지, 가명을 쓸지, 아예 이름을 숨길지 결정하는 권리</td></tr><tr><td>동일성유지권</td><td>내 작품이 마음대로 바뀌거나 훼손되지 않도록 지키는 권리</td></tr><tr><td>복제권</td><td>내 작품을 복사하거나 찍어서 다시 만드는 권리</td></tr><tr><td>배포권</td><td>내 작품을 복제해 사람들에게 나누어주는 권리</td></tr><tr><td>전시권</td><td>그림이나 사진 등을 전시회에 보여주는 권리</td></tr><tr><td>공중송신권</td><td>인터넷, 방송 등을 통해 내 작품을 전송하거나 보여주는 권리</td></tr><tr><td>공연권</td><td>저작물을 공연·연주·상영·낭독 등의 방법으로 공중에게 공개하는 권리</td></tr><tr><td>2차적저작물작성권</td><td>내 작품을 바탕으로 새로운 창작물을 만드는 권리</td></tr><tr><td>대여권</td><td>상업용 음반이나 프로그램을 영리 목적으로 대여할 권리</td></tr></tbody></table></div>"}, {"t": "text", "title": "저작권의 특징", "html": "<p class='def'>① 저작권은 저작물의 창작과 ( ⟦k14⟧ ) 발생한다.</p><p class='note'>저작권 보호를 받기 위해 저작권 등록을 반드시 해야 하는 것은 아님.</p><p class='def'>② 저작재산권은 양도가 가능하지만 저작인격권은 양도가 ( ⟦k15⟧ )하다.</p><p class='def'>③ 저작재산권은 원칙적으로 저작자의 생존 기간 + 사망 후 ( ⟦k16⟧ )년까지 보호된다.</p><p class='def'>④ 저작인격권은 저작자에게만 속하며, 저작자가 사망한 뒤에도 명예를 훼손하는 방식으로 이용해서는 <b>안 된다</b>.</p><p class='def'>⑤ 모든 자료나 표현물이 저작권 보호를 받는 것은 <b>아니다</b>.</p><p class='note'>저작권법상 보호받지 않는 것 : 헌법·법률·조례·규칙, 법원의 판결, 사실만을 전달하는 시사보도 등</p><p class='def'>⑥ 일정한 경우에 저작재산권을 <b>제한</b>하는 규정을 두고 있다.</p><p class='note'>법에서 정한 조건과 범위 안에서는 수업 목적 이용, 사적 이용을 위한 복제, 시사보도, 공표된 저작물의 인용, 도서관 복제 등의 경우 저작재산권이 제한될 수 있음</p>"}, {"t": "info", "tone": "warn", "html": "<b>주의</b> 공공기관 자료나 뉴스라고 해서 항상 마음대로 복사·수정·공유할 수 있는 것은 아니다. 조건을 확인해야 한다.<br><b>공개되어 있다 ≠ 저작권이 없다</b>는 뜻이 아니다."}]}, {"key": "infringe", "kind": "lesson", "period": 1, "title": "교육 ④ 저작권 침해와 올바른 이용", "short": "침해·5단계", "lead": "어떤 행동이 침해일까요? 판정 기준과 올바른 이용 5단계를 익혀 두세요. 2차시 <b>사건 판정실</b>에 그대로 나와요!", "blocks": [{"t": "text", "title": "저작권 침해", "html": "<p class='def'>저작권자의 허락이 필요한데도 ( ⟦k19⟧ ) 저작물을 이용하거나, 허락받은 범위를 <b>넘어</b> 사용하는 것이다.</p>"}, {"t": "info", "html": "<p><b>판정의 핵심</b> “무료인가?”보다 “이용 조건을 확인했는가?”, “허락받은 범위 안인가?”, “출처를 표시했는가?”를 먼저 본다.</p>"}, {"t": "text", "title": "링크 공유와 파일 공유는 다르다", "html": "<div class='tbl-wrap'><table class='tbl'><thead><tr><th>구분</th><th>예시</th><th>판단 기준</th></tr></thead><tbody><tr><td>공식 링크 공유</td><td>공식 유튜브 링크, 공식 기사 링크, 공공기관 자료 페이지 링크</td><td>상대적으로 안전하지만, 사이트 약관과 상황 확인</td></tr><tr><td>파일 직접 공유</td><td>영상 파일 저장 후 전송, 기사 전문 복사 붙여 넣기, 문제집 스캔본 공유</td><td>복제·전송 등 저작권 문제가 생길 수 있어 위험</td></tr><tr><td>캡처 공유</td><td>웹툰, 강의, 드라마, 문제집, 유료 콘텐츠 캡처</td><td>캡처는 복제가 될 수 있고, 공유하면 전송 등 저작권 문제가 생길 수 있음</td></tr></tbody></table></div><p class='def'>⇒ 자료를 공유할 때는 파일보다 공식 ( ⟦k20⟧ )를 공유하는 것이 대체로 더 안전하다.</p>"}, {"t": "text", "title": "타인의 저작물을 올바르게 이용하는 5단계", "html": "<div class='steps'><div class='step'><span class='stn'>1단계</span><div><p class='def'>어떤 저작물을 이용할 것인지 <b>결정</b>한다.</p><p class='note'>무엇을, 어디에, 어떤 목적으로 쓸지 정한다.</p></div></div><div class='step'><span class='stn'>2단계</span><div><p class='def'>저작권 보호를 받는 저작물인지 <b>확인</b>한다.</p><p class='note'>잘 모르겠으면 보호받는다고 생각하고 조심한다.</p></div></div><div class='step'><span class='stn'>3단계</span><div><p class='def'>법에서 정한 범위나 이용 조건에 따라 허락 없이 이용할 수 있는지 <b>확인</b>한다.</p><p class='note'>수업 목적 이용, 개인적 이용, SNS 공개, 유튜브 업로드는 이용 범위와 조건이 다를 수 있다.</p></div></div><div class='step'><span class='stn'>4단계</span><div><p class='def'>필요하면 저작권자에게 ( ⟦k17⟧ )을 요청한다.</p><p class='note'>제목, 이용 목적, 이용 방법, 공개 범위를 알린다.</p></div></div><div class='step'><span class='stn'>5단계</span><div><p class='def'>허락받은 ( ⟦k18⟧ ) 안에서 이용하고 출처를 표시한다.</p><p class='note'>발표용 허락은 SNS 업로드 허락과 다를 수 있다.</p></div></div></div>"}]}, {"key": "ccl", "kind": "lesson", "period": 1, "title": "교육 ⑤ 출처 표시와 CCL", "short": "출처·CCL", "lead": "출처를 쓰면 다 괜찮을까요? 먼저 도장을 찍어 보고, 출처 표시 요소와 CCL 기호를 익혀요.", "blocks": [{"t": "judge", "id": "myth", "opts": ["O", "X"], "reason": "이렇게 판단한 이유", "items": [{"id": "i1", "q": "출처 표시 = 이용 허락"}]}, {"t": "info", "tone": "accent", "html": "<p><b>출처 표시 요소</b> 만든 사람 / 자료 제목 / 가져온 곳 / URL / 가져온 날짜</p><p>예시 — 사진: 홍길동, 「봄날의 학교」, ○○사이트, URL, 2026.5.10. 접속</p>"}, {"t": "text", "title": "저작물 이용 허락 표시 (CCL)", "html": "<p class='def'>( ⟦k21⟧ ) (CCL, Creative Commons License)</p><p class='note'>저작자가 자신의 저작물을 다른 사람이 정해진 조건 안에서 이용할 수 있도록 미리 허락해 둔 라이선스</p><div class='ccl-grid'><div class='ccl'><div class='ccl-ic'><svg class=\"ccsvg\" viewBox=\"0 0 496 512\" width=\"54\" height=\"54\" role=\"img\" aria-label=\"CC 아이콘\"><path fill=\"currentColor\" d=\"M314.9 194.4v101.4h-28.3v120.5h-77.1V295.9h-28.3V194.4c0-4.4 1.6-8.2 4.6-11.3 3.1-3.1 6.9-4.7 11.3-4.7H299c4.1 0 7.8 1.6 11.1 4.7 3.1 3.2 4.8 6.9 4.8 11.3zm-101.5-63.7c0-23.3 11.5-35 34.5-35s34.5 11.7 34.5 35c0 23-11.5 34.5-34.5 34.5s-34.5-11.5-34.5-34.5zM247.6 8C389.4 8 496 118.1 496 256c0 147.1-118.5 248-248.4 248C113.6 504 0 394.5 0 256 0 123.1 104.7 8 247.6 8zm.8 44.7C130.2 52.7 44.7 150.6 44.7 256c0 109.8 91.2 202.8 203.7 202.8 103.2 0 202.8-81.1 202.8-202.8.1-113.8-90.2-203.3-202.8-203.3z\"/></svg></div><div class='ccl-body'><p class='def'>( ⟦k22⟧ ), Attribution / 기호 : ( ⟦k23⟧ )</p><p class='note'>저작자·출처·CCL 조건 등을 표시하고, 변경한 경우에는 변경 사실도 알려야 하는 조건. BY는 “made by ○○”처럼 만든 사람을 밝힌다는 뜻으로 이해하면 쉽다.</p></div></div><div class='ccl'><div class='ccl-ic'><svg class=\"ccsvg\" viewBox=\"0 0 496 512\" width=\"54\" height=\"54\" role=\"img\" aria-label=\"CC 아이콘\"><path fill=\"currentCo 0 63.6-41 132.9-128.9 132.9-38.9 0-99.1-20-109.4-97h62.5c1.5 30.1 19.6 45.2 54.5 45.2 23.3 0 58-18.2 58-82.8 0-82.5-49.1-80.6-56.7-80.6-33.1 0-51.7 14.6-55.8 43.8h18.2l-49.2 49.2-49-49.2h19.4z\"/></svg></div><div class='ccl-body'><p class='def'>( ⟦k28⟧ ), Share Alike / 기호 : ( ⟦k29⟧ )</p><p class='note'>저작물을 변경해 만든 결과물을 공유할 때, 원 저작물과 동일한 라이선스를 적용해야 한다는 의미.</p></div></div></div><p class='note'>※ BY·NC·ND·SA는 각각 ‘이용 조건’이며, 이 조건들을 조합하여 여러 종류의 CCL 라이선스가 만들어진다.</p><p class='note credit'>CC 아이콘 출처: Font Awesome Free, fontawesome.com, CC BY 4.0 ← 이것도 출처 표시예요!</p>"}]}, {"key": "kogl", "kind": "lesson", "period": 1, "title": "교육 ⑥ 공공누리와 공유마당", "short": "공공누리", "lead": "공공기관 자료라고 마음대로 써도 될까요? 유형표를 잘 봐 두세요. 2차시 <b>공공자료 보관실</b>에서는 이 표 없이 판정해야 해요!", "blocks": [{"t": "text", "html": "<p class='def'>㉠ ( ⟦k30⟧ ) : 국가, 지방자치단체, 공공기관이 보유·관리하는 공공저작물을 조건에 따라 이용할 수 있도록 안내하는 제도</p><div class='tbl-wrap'><table class='tbl'><thead><tr><th>유형</th><th>조건</th><th>확인할 점</th></tr></thead><tbody><tr><td>제1유형</td><td>출처 표시</td><td>상업적 이용 가능 / 변경 가능</td></tr><tr><td>제2유형</td><td>출처 표시 + 상업적 이용 금지</td><td>비상업적 이용만 가능 / 변경 가능</td></tr><tr><td>제3유형</td><td>출처 표시 + 변경 금지</td><td>상업적 이용 가능 / 변경 불가</td></tr><tr><td>제4유형</td><td>출처 표시 + 상업적 이용 금지 + 변경 금지</td><td>비상업적 이용만 가능 / 변경 불가</td></tr></tbody></table></div><p class='note'><b>★ 2026년 새롭게 추가된 유형</b><br>· 제0유형(자유이용): 출처 표시 조건 없이 상업적·비상업적 이용 및 변경 가능<br>· AI유형(인공지능 학습용): AI 학습용 데이터로 이용 가능. 단, ① 동일·실질적으로 유사한 산출물이 나오지 않도록 조치 ② 직접 인용하는 경우 출처 명시 조치 ③ 학습용 데이터의 재판매 금지<br>※ AI유형은 제1~4유형과 함께 표시될 수 있으며, AI 학습 목적이 아닐 때에는 함께 표시된 기존 유형의 조건을 따른다.</p><p class='def'>㉡ ( ⟦k31⟧ ) : 자유이용이 가능한 공유저작물을 제공하는 곳. 단, 자료별 이용 조건은 반드시 확인한다.</p>"}, {"t": "info", "tone": "warn", "html": "공공기관 자료도 무조건 마음대로 쓰는 것이 아니다. 적용 유형을 확인하고, 출처 표시·상업적 이용·변경·AI 학습 가능 여부와 이용 조건을 확인해야 한다."}]}, {"key": "digital", "kind": "lesson", "period": 1, "title": "교육 ⑦ 디지털 저작물과 컴퓨터프로그램", "short": "디지털·SW", "lead": "우리가 매일 쓰는 음악, 웹툰, 앱도 모두 저작물이에요.", "blocks": [{"t": "text", "title": "디지털 저작물", "html": "<p class='def'>( ⟦k32⟧ ) : 음악, 영화, 방송, 출판, 만화, 컴퓨터 프로그램 등 디지털 형태로 제작되거나 변환된 저작물</p><p class='sub'>특징 ① 원본과 복제물의 차이가 거의 <b>없다</b>.</p><p class='sub'>특징 ② 빠르고 쉽게 ( ⟦k33⟧ )하거나 ( ⟦k34⟧ )할 수 있다.</p><p class='sub'>보호 방법 ① 디지털 저작권 관리 ( ⟦k35⟧ )</p><p class='note'>디지털 콘텐츠의 불법 이용을 막고 저작권자의 권리를 보호하기 위해 접근·복제·이용 등을 통제하는 기술</p><p class='sub'>보호 방법 ② ( ⟦k36⟧ )</p><p class='note'>문서·이미지·음성·영상 등 디지털 콘텐츠에 저작권자 정보나 식별 정보 등을 삽입하여 저작권 확인과 불법 이용 추적 등에 활용하는 기술</p>"}, {"t": "info", "html": "<p><b>컴퓨터프로그램저작물</b> 컴퓨터에서 특정한 기능을 수행하도록 작성된 <b>프로그램</b>도 저작물로 보호된다. 프로그램의 저작재산권은 법률로 보호되며, 다른 저작물과 마찬가지로 양도·상속할 수 있다. 단, 프로그램 언어, 규약(프로토콜), 해법(알고리즘) 자체는 보호 대상이 아니다.</p><p><b>소프트웨어 사용 권리(라이선스)</b> 소프트웨어 저작권자가 정한 범위와 조건 안에서 소프트웨어를 사용할 수 있도록 허락하는 것</p><div class='tbl-wrap'><table class='tbl'><thead><tr><th>종류</th><th>설명</th><th>예</th></tr></thead><tbody><tr><td>상용 소프트웨어</td><td>돈을 내고 구매하거나 정식 라이선스를 받아 사용하는 프로그램</td><td>윈도우, 한글, 포토샵 등</td></tr><tr><td>셰어웨어</td><td>일정 기간 체험하거나 일부 기능을 무료로 사용한 뒤 계속 쓰려면 구매하는 프로그램</td><td>14일 버전(체험판) 등</td></tr><tr><td>프리웨어</td><td>무료로 사용할 수 있는 프로그램. 단, 무료라고 해서 수정, 재배포, 상업적 이용까지 모두 허용되는 것은 아니므로 이용 조건을 확인해야 한다.</td><td>개인 사용자에게 무료로 제공되는 프로그램 등</td></tr><tr><td>오픈 소스 소프트웨어</td><td>소스 코드를 공개하여 정해진 라이선스 조건에 따라 사용, 수정, 재배포할 수 있는 프로그램</td><td>리눅스, 안드로이드 오픈소스 프로젝트(AOSP) 등</td></tr></tbody></table></div><p><b>더 알아보기: 폰트</b> 글꼴 파일도 저작권 또는 이용 조건이 있을 수 있다. 무료라도 개인/학교/영상/상업적 이용 조건을 확인한다.</p>"}]}, {"key": "ai", "kind": "lesson", "period": 1, "title": "교육 ⑧ 생성형 AI와 저작권·과제 윤리", "short": "생성형 AI", "lead": "AI로 만든 결과물은 누구 것일까요? 2차시 <b>AI 실험실</b>에서 판정할 내용이에요.", "blocks": [{"t": "info", "tone": "accent", "html": "<p>생성형 AI를 사용할 때에는 ① AI 결과물의 저작권 보호 여부 ② 기존 저작물의 침해 가능성 ③ 과제 규칙과 이용 조건을 함께 확인해야 한다.</p><p>※ 프롬프트를 여러 번 입력했다는 사실만으로 AI 결과물 전체가 자동으로 ‘내 저작물’이 되는 것은 아니다.</p>"}, {"t": "info", "html": "<p><b>2026 최신! 생성형 AI와 저작권</b></p><p>① AI도 저작자가 될 수 있을까? → <b>X</b>. 현행 저작권법은 인간의 창작물을 전제로 하므로, AI 자체는 저작자로 인정되지 않는다.</p><p>② 프롬프트만 입력하면 결과물이 모두 내 저작물일까? → <b>X</b>. 인간이 얼마나 창작적으로 기여했는지가 중요하다. 사람의 창작성이 인정되는 가필·수정·선택·배열 부분은 저작물로 보호될 수 있다.</p><p>③ AI가 만든 결과물이 기존 작품과 비슷해도 괜찮을까? → <b>X</b>. 기존 저작물을 토대로 만들어졌고, 그 저작물의 창작적 표현과 실질적으로 유사하면 저작권 문제가 생길 수 있다.</p><p>④ AI가 인터넷 저작물을 학습하는 것은 항상 자유로울까? → 항상 자유로운 것도, 항상 침해인 것도 아니다. AI 학습을 위한 저작물 이용도 저작권법의 적용을 받으며, 공정이용 여부는 이용 목적·방법·분량·시장에 미치는 영향 등을 종합해 판단한다.</p><p>⑤ AI 사용 사실 표시와 출처 표시는 같은 것일까? → <b>X</b>. AI 사용 사실 표시 = 과제 규칙 등에 따라 AI를 활용했다는 사실을 밝힘 / 출처 표시 = 실제 이용한 저작물의 저작자와 출처를 밝힘</p>"}]}, {"key": "submit1", "kind": "submit", "period": 1, "title": "교육 노트 제출", "short": "제출", "lead": "1차시 수사관 교육 끝! 교육 노트(결과지)를 PDF로 저장해 구글 클래스룸 과제에 제출하세요. 2차시에는 출동해서 방탈출을 해요.", "blocks": [{"t": "submit"}]}], "blanks": {"k1": {"w": 3, "cho": "ㅈㅈㅁ", "tiles": ["저", "물", "작"]}, "k2": {"w": 2, "cho": "", "tiles": ["상", "사"]}, "k3": {"w": 2, "cho": "", "tiles": ["정", "감"]}, "k4": {"w": 3, "cho": "", "tiles": ["작", "창", "물"]}, "k5": {"w": 2, "cho": "", "tiles": ["현", "표"]}, "k6": {"w": 3, "cho": "", "tiles": ["성", "작", "창"]}, "k7": {"w": 3, "cho": "ㅈㅈㅈ", "tiles": ["자", "저", "작"]}, "k8": {"w": 4, "cho": "ㅈㅈㄱㅈ", "tiles": ["권", "자", "작", "저"]}, "k9": {"w": 3, "cho": "ㅈㅈㄱ", "tiles": ["저", "권", "작"]}, "k10": {"w": 5, "cho": "", "tiles": ["권", "작", "인", "저", "격"]}, "k11": {"w": 2, "cho": "", "tiles": ["예", "명"]}, "k12": {"w": 5, "cho": "", "tiles": ["재", "권", "저", "산", "작"]}, "k13": {"w": 3, "cho": "", "tiles": ["경", "적", "제"]}, "k14": {"w": 3, "cho": "", "tiles": ["시", "에", "동"]}, "k15": {"w": 3, "cho": "", "tiles": ["능", "불", "가"]}, "k16": {"w": 2, "cho": "", "tiles": ["0", "7"]}, "k17": {"w": 2, "cho": "", "tiles": ["락", "허"]}, "k18": {"w": 2, "cho": "", "tiles": ["위", "범"]}, "k19": {"w": 5, "cho": "", "tiles": ["없", "락", "이", "허"]}, "k20": {"w": 2, "cho": "", "tiles": ["크", "링"]}, "k21": {"w": 12, "cho": "", "tiles": ["허", "락", "시", "저", "용", "작", "이", "물", "표"]}, "k22": {"w": 6, "cho": "", "tiles": ["시", "저", "표", "작", "자"]}, "k23": {"w": 2, "cho": "", "tiles": ["Y", "B"]}, "k24": {"w": 3, "cho": "", "tiles": ["비", "리", "영"]}, "k25": {"w": 2, "cho": "", "tiles": ["C", "N"]}, " function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

/* ---------- 보스 ---------- */

function paginate() {

  return pages;
}
